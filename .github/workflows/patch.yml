name: One off patch

# Adds Back Bay Climb Out (3256589) as segment 21, pulls its map line and grades,
# and rewinds every rider to 1 January so the year is re-scanned for efforts on it.
#
# The rewind is necessary, not lazy: a rider's past efforts on a segment only enter
# state.json if that segment was tracked at the time the activity was read. Back Bay
# Climb Out was not, so those efforts were parsed and discarded. The only way to get
# them is to read the activities again.
#
# Safe to redo: season totals dedupe by activity id, attempts by effort id, times
# take the minimum, power only ratchets up. Nothing double counts.
#
# Delete this file once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add the segment and rewind the riders
        run: |
          python - <<'PYEOF'
          import base64, json, datetime
          P = json.loads(base64.b64decode(""))
          new = P["add"]

          meta = json.load(open("data/meta.json"))
          ids = {s["id"] for s in meta["segments"]}
          assert new["id"] not in ids, "already tracked"
          meta["segments"].append(new)
          for i, s in enumerate(meta["segments"], 1):
              s["num"] = "%02d" % i
          json.dump(meta, open("data/meta.json", "w"), indent=2)
          print("added %s as %s, now %d segments"
                % (new["name"], meta["segments"][-1]["num"], len(meta["segments"])))

          st = json.load(open("data/state.json"))
          for k, a in st["athletes"].items():
              a["last_epoch"] = P["reset_to"]
          json.dump(st, open("data/state.json", "w"), indent=2)
          print("rewound %d riders to %s" % (len(st["athletes"]),
                datetime.datetime.utcfromtimestamp(P["reset_to"]).date()))
          PYEOF

      - name: Pull its map line and grades
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
        run: python scripts/segmaps.py

      - name: Check the file is sound
        run: |
          python - <<'PYEOF'
          import json
          m = json.load(open("data/meta.json"))
          n = len(m["segments"])
          assert len(m["polylines"]) == n, "polylines %d vs %d segments" % (len(m["polylines"]), n)
          assert len(m["grades"]) == n, "grades %d vs %d segments" % (len(m["grades"]), n)
          assert all(len(m["grades"][k]) == len(m["polylines"][k]) for k in m["polylines"])
          assert [s["num"] for s in m["segments"]] == ["%02d" % i for i in range(1, n + 1)]
          print("%d segments, every one with a line and matching grades" % n)
          PYEOF

      - name: First pass at the new segment's times
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          STRAVA_REFRESH_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          STRAVA_REFRESH_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          STRAVA_REFRESH_MICHAEL: ${{ secrets.STRAVA_REFRESH_MICHAEL }}
          STRAVA_REFRESH_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          STRAVA_REFRESH_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
        run: |
          # Will not finish in one window. It saves its place and the daily run
          # picks up where it stopped.
          python scripts/update.py

      - name: Commit
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meta.json data.js data/state.json data/last_run.json data/honours.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Twenty one segments: add Back Bay Climb Out"
            git pull --rebase --autostash origin main
            git push
          fi
