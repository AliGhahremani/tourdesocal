name: One off patch

# The big map caption still advertised Glendora as the northern end of the route.
# Glendora Mountain Road is no longer a segment, so it no longer is.
# Delete this file once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python - <<'PYEOF'
          import base64, json
          P = json.loads(base64.b64decode(""))
          for path, hunks in P["hunks"].items():
              s = open(path, encoding="utf-8").read()
              for old, new in hunks:
                  n = s.count(old)
                  assert n == 1, "%s: expected 1 match, found %d" % (path, n)
                  s = s.replace(old, new)
              open(path, "w", encoding="utf-8").write(s)
              print("patched", path)
          PYEOF
      - name: Commit
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "The route no longer reaches Glendora"
            git pull --rebase --autostash origin main
            git push
          fi
