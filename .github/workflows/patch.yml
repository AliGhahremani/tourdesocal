name: One off patch

# Applies a set of exact text replacements to index.html and scripts/update.py.
# The edits were written and tested outside the repo; this only carries them in.
# Delete this file once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply
        run: |
          python - <<'PYEOF'
          import base64, json
          H = json.loads(base64.b64decode(""))
          for path, hunks in H.items():
              s = open(path).read()
              for old, new in hunks:
                  n = s.count(old)
                  assert n == 1, "%s: expected 1 match, found %d for:\n%s" % (path, n, old[:200])
                  s = s.replace(old, new)
              open(path, "w").write(s)
              print("patched", path, len(hunks), "hunks")
          PYEOF
      - name: Commit
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scripts/update.py
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Colour the segment maps by how steep the road is"
            git push
          fi
