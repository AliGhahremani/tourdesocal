name: One off patch

# Applies exact text replacements to scripts/update.py. Written and tested
# outside the repo; this only carries the change in. Delete once it has run.
#
# It cannot touch anything under .github/workflows: GITHUB_TOKEN is refused
# permission to write workflow files, by design. Those go in by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply
        run: |
          python - <<'PYEOF'
          import base64, json
          P = json.loads(base64.b64decode(""))
          for path, hunks in P["hunks"].items():
              s = open(path).read()
              for old, new in hunks:
                  n = s.count(old)
                  assert n == 1, "%s: expected 1 match, found %d for:\n%s" % (path, n, old[:200])
                  s = s.replace(old, new)
              open(path, "w").write(s)
              print("patched", path, len(hunks), "hunks")
          PYEOF
      - name: Sanity check
        run: python -c "import ast;ast.parse(open('scripts/update.py').read());print('update.py parses')"
      - name: Commit
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update.py
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Survive a budget that runs out on the first read, and pace for a 15 minute chase"
            git pull --rebase --autostash origin main
            git push
          fi
