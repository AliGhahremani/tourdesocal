name: Update standings

on:
  schedule:
    # Hourly, at :05. Ali's call 2026-08-29: he wants a ride on the board the
    # same day, not the next morning. A run that finds nothing costs about ten
    # reads (five token refreshes, five activity pages), so twenty four runs is
    # roughly 250 of the 2,000 daily budget shared with 2024michael. Measured:
    # a run that picked up fourteen activities used 27.
    #
    # UTC all year, so this is :05 past every hour Pacific too. No DST split is
    # needed for an hourly job, which is one less thing to get wrong.
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest efforts from Strava
        env:
          STRAVA_CLIENT_ID: "274192"   # public value, same app as 2024michael
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          STRAVA_REFRESH_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          STRAVA_REFRESH_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          STRAVA_REFRESH_MICHAEL: ${{ secrets.STRAVA_REFRESH_MICHAEL }}
          STRAVA_REFRESH_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          STRAVA_REFRESH_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
        run: python scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          # last_run.json carries finished_utc, so it differs on every single
          # run. Staging it up front would make "nothing changed" impossible and
          # push two dozen empty commits a day, each one rebuilding Pages. Stage
          # the real data first, and only record the run when something moved.
          git add data/state.json data.js data/honours.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git add data/last_run.json
            git commit -m "Auto-update standings $(date -u +%F)"
            # Another run, or a hand edit, may have pushed while this one was
            # waiting out a rate limit window. Without this the push is rejected
            # and a whole pass of Strava reads is thrown away. That has happened.
            git pull --rebase --autostash origin main
            git push
          fi
