          python3 - <<'PYEOF'
          import base64, gzip, json, os
          blob = "".join(open("payload.b64").read().split())
          for path, content in json.loads(gzip.decompress(base64.b64decode(blob))).items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              open(path, "w", encoding="utf-8").write(content)
              print(f"wrote {path} ({len(content)} bytes)")
          PYEOF

      - name: Remove Michael
        run: python3 remove_michael.py

      - name: Rebuild data.js from what is left
        # No refresh tokens in this step's environment on purpose: every rider is
        # skipped and only data.js is regenerated from data/state.json.
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: python3 scripts/update.py

      - name: Check nothing is left behind
        run: |
          python3 - <<'PYEOF'
          import json, sys
          st = json.load(open("data/state.json"))
          assert "michael" not in st["athletes"], "michael still in state.json"
          print("riders:", ", ".join(sorted(st["athletes"])))
          assert len(st["athletes"]) == 5, len(st["athletes"])
          js = open("data.js", encoding="utf-8").read()
          assert "Michael" not in js, "Michael still in data.js"
          html = open("index.html", encoding="utf-8").read()
          assert "Michael" not in html, "Michael still in index.html"
          assert "five riders" in html, "rider count not updated in index.html"
          h = json.load(open("data/honours.json"))
          assert h["seasons"] == [], f"honours not empty: {h['seasons']}"
          assert len(open("data/announce_email.html", encoding="utf-8").read()) > 10000
          print("all checks passed")
          PYEOF

      - name: Commit
        run: |
          rm -f remove_michael.py payload.b64
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Remove Michael from the roster; fix the roll of honour archiver"
            git pull --rebase --autostash origin main
            git push
          fi
