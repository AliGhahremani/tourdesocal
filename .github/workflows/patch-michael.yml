name: Remove Michael and stage the announcement

# One-off, 2026-08-28. Michael asked to be taken off the roster, so this deletes
# him from the live data and every rider table in the front end, then rebuilds
# data.js from what is left. It also fixes a real bug in the roll of honour and
# drops the fake 2025 season that bug produced.
#
# Reads nothing from Strava, so it costs nothing against the shared 2,000/day.
#
# Delete this file once it has run green.
#
# Why a base64 payload instead of committing the script: a workflow cannot write
# anything under .github/workflows, and pasting a large file into the GitHub web
# editor appends rather than replaces, because CodeMirror only keeps the visible
# lines in the DOM. A gzipped blob unpacked on the runner sidesteps both.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Must never race the daily standings update.
  group: update-standings
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack the payload
