name: Phantom rides audit

# Does the site still count rides that have been deleted from Strava?
#
# update.py accumulates. Season totals are monotonic: an activity id lands in
# season["ids"] once, and its distance, elevation, ride count and moving time are
# added to running sums that are never recomputed. There is no reconciliation
# pass, so an activity deleted on Strava keeps its miles here forever. The same
# is true of edits: correcting a ride's distance on Strava does not correct ours.
#
# That matters because two of the three jerseys ARE those sums. Green is miles
# and polka dot is elevation, so a duplicate someone uploaded and then deleted is
# still competing.
#
# This recomputes each rider's season from what Strava holds right now and prints
# it against what we stored. Summaries only, about 3 reads per rider, no detail
# calls. Read-only: it reports, it does not fix.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recompute from Strava
        env:
          CID: "274192"
          CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
          RT_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          RT_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          RT_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          RT_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          RT_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
          RT_OSCAR: ${{ secrets.STRAVA_REFRESH_OSCAR }}
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request

          YEAR = "2026"
          START = int(datetime.datetime(int(YEAR), 1, 1,
                      tzinfo=datetime.timezone.utc).timestamp())
          M = 1609.344
          FT = 3.280839895
          STATE = json.load(open("data/state.json"))
          RIDERS = ["ali", "jake", "randee", "abe", "jose", "oscar"]
          usage = None

          def post(url, data):
              r = urllib.request.Request(
                  url, data=urllib.parse.urlencode(data).encode(), method="POST")
              with urllib.request.urlopen(r) as f:
                  return json.load(f)

          def get(url, token):
              global usage
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(r) as f:
                  usage = f.headers.get("X-RateLimit-Usage")
                  return json.load(f)

          rows = []
          for key in RIDERS:
              ath = STATE["athletes"].get(key) or {}
              who = ath.get("display", key)
              rt = os.environ.get("RT_" + key.upper())
              if not rt:
                  print(f"[{who}] no refresh token, skipped")
                  continue
              try:
                  tok = post("https://www.strava.com/oauth/token", {
                      "client_id": os.environ["CID"],
                      "client_secret": os.environ["CSEC"],
                      "grant_type": "refresh_token", "refresh_token": rt})["access_token"]
              except urllib.error.HTTPError as e:
                  print(f"[{who}] token refresh FAILED ({e.code}); not audited")
                  continue

              live, page = {}, 1
              while page <= 6:
                  batch = get("https://www.strava.com/api/v3/athlete/activities"
                              f"?after={START}&per_page=200&page={page}", tok)
                  if not batch:
                      break
                  for a in batch:
                      live[int(a["id"])] = a
                  page += 1

              season = (ath.get("season") or {}).get(YEAR) or {}
              held = [int(i) for i in (season.get("ids") or [])]
              heldset = set(held)

              # An id we counted that Strava no longer returns. We cannot recover
              # what it contributed, only that it is still in our totals.
              gone = [i for i in held if i not in live]
              # E-bikes never entered our totals, so they are not "missed".
              missed = [i for i, a in live.items()
                        if i not in heldset and a.get("type") != "EBikeRide"]

              # What the totals WOULD be, recomputed from what exists now.
              true_d = sum(float(a.get("distance") or 0) for i, a in live.items()
                           if i in heldset)
              true_e = sum(float(a.get("total_elevation_gain") or 0)
                           for i, a in live.items() if i in heldset)

              stored_mi = (season.get("dist_m") or 0) / M
              stored_ft = (season.get("elev_m") or 0) * FT
              rows.append((who, len(held), len(gone), len(missed),
                           stored_mi, true_d / M, stored_ft, true_e * FT))

              print(f"[{who}] we count {len(held)} rides; Strava currently has "
                    f"{len(live)} activities this year")
              if gone:
                  print(f"         {len(gone)} of our counted rides NO LONGER EXIST on Strava")
                  for i in gone[:12]:
                      print(f"           activity {i}")
                  if len(gone) > 12:
                      print(f"           ... and {len(gone)-12} more")
              if missed:
                  print(f"         {len(missed)} activities on Strava we never counted")

          print("\n" + "=" * 78)
          print(f"{'rider':8} {'counted':>8} {'deleted':>8} {'uncounted':>10} "
                f"{'our miles':>10} {'real':>10} {'our feet':>10} {'real':>10}")
          deleted_any = edited_any = False
          for who, held, gone, missed, smi, tmi, sft, tft in rows:
              drift = round(smi, 1) != round(tmi, 1) or round(sft) != round(tft)
              if gone:
                  flag = "  <-- deleted rides still counted"
                  deleted_any = True
              elif drift:
                  flag = "  <-- totals drifted, no deletions"
                  edited_any = True
              else:
                  flag = ""
              print(f"{who:8} {held:8} {gone:8} {missed:10} "
                    f"{smi:10.1f} {tmi:10.1f} {sft:10.0f} {tft:10.0f}{flag}")
          print()
          if deleted_any:
              print("Rides we counted are gone from Strava, and their miles and feet are")
              print("still in our totals. Green jersey is miles and polka dot is elevation,")
              print("so this is deciding a jersey race.")
          if edited_any:
              print("Some totals differ with nothing deleted. That is an activity whose")
              print("distance or elevation was EDITED on Strava after we counted it. We")
              print("add once and never revisit, so the original value is what we kept.")
          if not deleted_any and not edited_any:
              print("Every stored total matches what Strava holds right now. Nothing has")
              print("been deleted or edited out from under us.")
          print(f"\nStrava rate limit usage: {usage}")
          PYEOF
