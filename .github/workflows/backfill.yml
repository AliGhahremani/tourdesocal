name: Backfill chase

# Runs the updater every 15 minutes until every rider is caught up. Only needed
# once, to pull in a season that already happened.
#
# Why 15 minutes: Strava allows 200 reads per 15 minute window, and the windows
# align to :00, :15, :30 and :45. One firing takes one window's worth of reads and
# commits, so the site fills in visibly and a run that dies loses at most one
# window instead of the whole day. The 2,000 reads/day ceiling is enforced inside
# update.py, which also leaves headroom for 2024michael.
#
# It CANNOT delete itself: GITHUB_TOKEN is refused permission to write anything
# under .github/workflows, by design. So instead it goes quiet. Once every rider
# is caught up, the first step sees that and skips the rest, costing a few seconds
# of runner time and no Strava reads at all.
#
# DELETE THIS FILE by hand once the standings are current. It is safe to leave,
# just untidy.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-standings   # never overlaps the daily run or the map rebuild
  cancel-in-progress: false

jobs:
  chase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is there anything left to chase
        id: check
        run: |
          # backfill_complete means every connected rider's last_epoch is within
          # six hours of now. It is a fact about the data, so a run that did no
          # work cannot switch this off early.
          done=$(python - <<'PY'
          import json
          try:
              print(json.load(open("data/last_run.json")).get("backfill_complete") is True)
          except Exception:
              print(False)
          PY
          )
          echo "done=$done" >> "$GITHUB_OUTPUT"
          echo "caught up: $done"
          if [ "$done" = "True" ]; then
            echo "::notice::Backfill is caught up. This workflow is now doing nothing on every firing. Delete .github/workflows/backfill.yml when convenient."
          fi

      - name: Pull the next window of efforts
        if: steps.check.outputs.done != 'True'
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          STRAVA_REFRESH_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          STRAVA_REFRESH_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          STRAVA_REFRESH_MICHAEL: ${{ secrets.STRAVA_REFRESH_MICHAEL }}
          STRAVA_REFRESH_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          STRAVA_REFRESH_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
        run: python scripts/update.py

      - name: Commit whatever this window got
        if: steps.check.outputs.done != 'True'
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data.js data/last_run.json data/honours.json
          if git diff --cached --quiet; then
            echo "Nothing new this window."
          else
            git commit -m "Backfill $(date -u +'%F %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi
