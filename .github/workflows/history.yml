name: Build season history

# The site knows season TOTALS and nothing about how they got there, so there
# is no way to draw the green jersey or polka dot race over time from
# state.json. This rebuilds the whole season day by day from Strava activity
# SUMMARIES, which carry start_date_local, distance and total_elevation_gain
# and cost about 2 reads per rider. Roughly 10 reads for the entire year.
#
# The work is in scripts/history.py, so the weekly digest can call the same
# code before it renders the chart images for the email.
#
# Writes data/history.js as window.HISTORY:
#   {"year","updated","riders":["..."],"days":["2026-01-01",...],
#    "miles":{"Ali":[cumulative...]}, "feet":{"Ali":[cumulative...]}}
#
# A .js file rather than .json for the same reason data.js is one: index.html
# loads it with a script tag, which works from a file:// copy and needs no
# fetch, no CORS and no loading race.
#
# One value per DAY from Jan 1 to today, cumulative, so a chart can read it
# straight off without doing arithmetic in the browser. Days with no riding
# repeat the previous total, which is what a cumulative race looks like.
#
# It counts EXACTLY the activities the standings count, by filtering on the
# id list state.json already stores under season[year]["ids"]. That list is
# what update.py actually accepted, so the chart can never disagree with the
# board it sits under.
#
# This matters more than it looks. update.py excludes e-bike and Peloton rides
# by reading device_name, which exists ONLY on the activity detail, not on the
# summary. A summary-only rebuild cannot apply that rule and silently counted
# Peloton miles: Jake came out 224 miles high, and Randee 41 miles high on
# exactly 0 extra feet, which is what indoor riding looks like. Reusing the id
# list gets it right for 11 reads instead of the ~800 that fetching every
# detail would cost.
#
# A ride that has happened but has not been through update.py yet is not in
# ids, so it is not in the chart either. That is correct: it is not in the
# standings either, and the two must agree.
#
# Safe to re-run. It rebuilds from scratch every time rather than appending,
# so it can never drift from Strava.

on:
  workflow_dispatch:
  schedule:
    # Every four hours at :50, offset from update.yml's :05 and :35 so the two
    # never sit in the same minute. They share a concurrency group, so a clash
    # only queues rather than breaks, but queueing wastes a runner. The standings now refresh hourly, so a daily
    # chart rebuild would leave the race charts up to a day behind the table
    # they sit under.
    #
    # Six runs a day at about 11 reads each is ~66 of the 2,000 shared daily
    # budget. Rebuilding the whole season every time is what keeps it honest,
    # so this is the cost of not letting it drift.
    - cron: "50 */4 * * *"

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the season day by day
        env:
          CID: "274192"
          CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
          RT_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          RT_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          RT_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          RT_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          RT_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
          RT_OSCAR: ${{ secrets.STRAVA_REFRESH_OSCAR }}
        run: python3 scripts/history.py

      - name: Commit
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.js
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Rebuild season history $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
