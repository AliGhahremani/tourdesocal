name: Weekly digest

# Emails the week's changes and archives them at tourdesocal.com/weekly.html.
#
# Reads nothing from Strava, so it costs nothing against the shared 2,000/day
# rate limit. It only diffs data/state.json against last week's snapshot, so it
# must run AFTER the daily update has landed.
#
# Requires two secrets:
#   MAIL_USERNAME  the Gmail address the mail is sent from and to
#   MAIL_PASSWORD  a Gmail App Password, NOT the account password.
#                  Needs 2-Step Verification on: myaccount.google.com/apppasswords
#
# Without them the digest is still computed and committed; only the send is
# skipped, with a warning. That way the archive keeps working if the app
# password ever expires.

on:
  schedule:
    # Sunday 8:30 PM Pacific, which is Monday morning in UTC.
    #
    # GitHub runs scheduled workflows on a BEST EFFORT basis and silently drops
    # them under load, which is how the 2026-08-30 digest missed its slot: the
    # half hourly updater was landing roughly every two hours that day. So the
    # send is attempted four times across Sunday evening instead of once, and
    # the crons sit on odd minutes because the top of the hour and the half
    # hour are the busiest, most heavily shed moments on the shared runners.
    #
    # Every attempt after the first sees weekly/<that Sunday>.html already in
    # the repo and exits before sending, so nobody is ever mailed twice. All
    # four attempts fall on the same Pacific Sunday, which is what makes that
    # filename a reliable "already sent" marker.
    - cron: "32 3 * 3-10 1"       # 8:32 PM PDT Sun (Mar-Oct)
    - cron: "20 4 * 3-10 1"       # 9:20 PM PDT Sun, if the first was dropped
    - cron: "10 5 * 3-10 1"       # 10:10 PM PDT Sun
    - cron: "40 6 * 3-10 1"       # 11:40 PM PDT Sun, last chance
    - cron: "32 4 * 1,2,11,12 1"  # 8:32 PM PST Sun (Nov-Feb)
    - cron: "20 5 * 1,2,11,12 1"  # 9:20 PM PST Sun
    - cron: "10 6 * 1,2,11,12 1"  # 10:10 PM PST Sun
    - cron: "40 7 * 1,2,11,12 1"  # 11:40 PM PST Sun
  workflow_dispatch:
    inputs:
      test_to:
        description: "Send only to this address instead of the usual list. Leave blank for the real send."
        required: false
        type: string
      skip_update:
        description: "Skip the Strava catch-up (use when only testing the email)"
        required: false
        type: boolean
        default: false
      force:
        description: "Send even if this Sunday's digest has already gone out. Mails everybody twice."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  # Has this week's digest already gone out? weekly/ holds one page per email
  # actually sent, named for the SUNDAY the digest covers, and it is committed
  # only on a real send. Its presence is therefore proof the mail went, and the
  # cheapest possible check: one checkout, no secrets, no Strava reads.
  #
  # The marker is the week's Sunday, never "today". GitHub ran the 8:32 PM
  # Sunday slot at 3:52 AM Monday on 2026-08-31, five hours late; a guard keyed
  # on today's date called that a different week, let it through, and mailed
  # everybody a second digest saying nobody had ridden.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          FORCE: ${{ inputs.force }}
          TEST_TO: ${{ inputs.test_to }}
        run: |
          day=$(TZ=America/Los_Angeles date +%F)
          dow=$(TZ=America/Los_Angeles date +%w)   # 0 = Sunday
          # Back up to this week's Sunday. A no-op when the run is on time.
          day=$(date -u -d "$day - $dow days" +%F)
          echo "Pacific now: $(TZ=America/Los_Angeles date '+%F %H:%M %a'), digest week: $day"
          if [[ "$TEST_TO" != "" ]]; then
            echo "Test send, always allowed." ; echo "go=true" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          if [[ "$FORCE" == "true" ]]; then
            echo "::warning::force was set, so this sends even if the week already went out."
            echo "go=true" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          if [[ -f "weekly/$day.html" ]]; then
            echo "::notice::weekly/$day.html is already in the repo, so the digest for the week ending $day has been sent. Stopping before anybody is mailed twice."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Catch up on today's rides first
        # A test send must never touch Strava. The commit step is skipped when
        # test_to is set, so any reads spent here would be thrown away, and the
        # daily budget is shared with 2024michael.
        if: inputs.skip_update != true && inputs.test_to == ''
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          STRAVA_REFRESH_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          STRAVA_REFRESH_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          STRAVA_REFRESH_MICHAEL: ${{ secrets.STRAVA_REFRESH_MICHAEL }}
          STRAVA_REFRESH_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          STRAVA_REFRESH_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
        run: |
          # Sunday rides land after the morning run, and Sunday is when people
          # actually ride. Without this the digest reports a week that ends
          # Saturday. continue-on-error so a rate limit cannot kill the digest.
          python scripts/update.py

      # The email needs pictures of the charts, and email clients do not run
      # JavaScript. Rebuild the season history first so the stills include
      # today's rides, then render and push them BEFORE the send: the email
      # references them by absolute URL, so they have to be live already.
      #
      # continue-on-error throughout. A failed render must never cost the
      # digest; weekly.py simply leaves the images out if the files are absent.
      - name: Refresh the season history
        if: inputs.test_to == ''
        continue-on-error: true
        env:
          CID: "274192"
          CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
          RT_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          RT_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          RT_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          RT_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          RT_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
        run: python3 scripts/history.py

      - name: Render the race charts
        id: shots
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node scripts/render_race.js race
          ls -la race/*.png

      - name: Publish the charts before the email goes out
        if: inputs.test_to == '' && steps.shots.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.js race/green.png race/polka.png
          if git diff --cached --quiet; then
            echo "Charts unchanged."
          else
            git commit -m "Race charts for $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
            # Pages needs a moment before the email can reference the images.
            sleep 45
          fi

      - name: Build the digest
        id: build
        run: |
          python scripts/weekly.py
          echo "week=$(date -u +'%b %d, %Y' | sed 's/ 0/ /')" >> "$GITHUB_OUTPUT"

      - name: Check mail credentials
        id: mail
        env:
          U: ${{ secrets.MAIL_USERNAME }}
          P: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [[ -n "$U" && -n "$P" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAIL_USERNAME or MAIL_PASSWORD is not set, so no email was sent. The digest was still built and committed."
          fi

      - name: Email the digest
        if: steps.mail.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Tour de SoCal
          # MAIL_TO is optional. With it unset the digest goes to the sender only,
          # so adding riders later is one secret and no code change.
          # A manual run can override the recipient list, so the formatting can
          # be checked without mailing everybody.
          to: ${{ inputs.test_to != '' && inputs.test_to || (secrets.MAIL_TO || secrets.MAIL_USERNAME) }}
          subject: "${{ inputs.test_to != '' && '[TEST] ' || '' }}Tour de SoCal, week ending ${{ steps.build.outputs.week }}"
          html_body: file:///tmp/weekly_email.html
          convert_markdown: false

      - name: Commit the digest and next week's snapshot
        if: inputs.test_to == ''
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          # weekly/ holds one page per email actually sent, plus its index.
          # This step only runs when test_to is empty, so a test send never
          # lands in the archive.
          git add weekly.html weekly/ data/weekly_snapshot.json data/weekly_latest.json \
                  data/state.json data.js data/last_run.json data/honours.json \
                  data/history.js race/green.png race/polka.png
          if git diff --cached --quiet; then
            echo "No digest changes."
          else
            git commit -m "Weekly digest $(date -u +%F)"
            # Never push without rebasing first. A push that loses a race here
            # is rejected and the digest is gone; the daily updater can still
            # be in flight when this runs.
            git pull --rebase --autostash origin main
            git push
          fi
