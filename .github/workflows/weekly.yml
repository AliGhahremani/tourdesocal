name: Weekly digest

# Emails the week's changes and archives them at tourdesocal.com/weekly.html.
#
# Reads nothing from Strava, so it costs nothing against the shared 2,000/day
# rate limit. It only diffs data/state.json against last week's snapshot, so it
# must run AFTER the daily update has landed.
#
# Requires two secrets:
#   MAIL_USERNAME  the Gmail address the mail is sent from and to
#   MAIL_PASSWORD  a Gmail App Password, NOT the account password.
#                  Needs 2-Step Verification on: myaccount.google.com/apppasswords
#
# Without them the digest is still computed and committed; only the send is
# skipped, with a warning. That way the archive keeps working if the app
# password ever expires.

on:
  schedule:
    # THE DIGEST GOES OUT AT 8:30 PM PACIFIC ON SUNDAY. Never another day,
    # never another time. Ali's rule, 2026-08-31, after a run that GitHub
    # dispatched five hours late mailed everybody at 3:52 AM on a Monday.
    #
    # GitHub's scheduler cannot be trusted to hit a minute. It runs scheduled
    # workflows on a BEST EFFORT basis and sheds them under load; this repo has
    # seen delays of five hours and better than two hours routinely. So the
    # cron is not the clock. The cron only tries to get a runner EARLY, and the
    # guard job then sits on that runner and waits until 8:30 PM Pacific before
    # letting anything send. A run that arrives at 6 PM waits two and a half
    # hours and goes out on time; a run that arrives after 11 PM is refused
    # outright rather than mailing everybody in the middle of the night.
    #
    # Four attempts per Sunday, first one to get a runner wins, and the guard
    # stops the rest by looking for weekly/<that Sunday>.html.
    - cron: "0 23 * 3-10 0"       # 4:00 PM PDT Sun, waits until 8:30
    - cron: "0 1 * 3-10 1"        # 6:00 PM PDT Sun, waits until 8:30
    - cron: "32 3 * 3-10 1"       # 8:32 PM PDT Sun, sends straight away
    - cron: "20 4 * 3-10 1"       # 9:20 PM PDT Sun, last chance
    - cron: "0 0 * 1,2,11,12 1"   # 4:00 PM PST Sun (Nov-Feb), waits until 8:30
    - cron: "0 2 * 1,2,11,12 1"   # 6:00 PM PST Sun
    - cron: "32 4 * 1,2,11,12 1"  # 8:32 PM PST Sun
    - cron: "20 5 * 1,2,11,12 1"  # 9:20 PM PST Sun
  workflow_dispatch:
    inputs:
      test_to:
        description: "Send only to this address instead of the usual list. Leave blank for the real send."
        required: false
        type: string
      skip_update:
        description: "Skip the Strava catch-up (use when only testing the email)"
        required: false
        type: boolean
        default: false
      force:
        description: "Send even if this Sunday's digest has already gone out. Mails everybody twice."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  # Two questions, and the answer to both has to be yes before a single email
  # moves: has this week's digest already gone out, and is it actually 8:30 PM
  # on Sunday yet?
  #
  # weekly/ holds one page per email actually sent, named for the SUNDAY the
  # digest covers, and it is committed only on a real send, so its presence is
  # proof the mail went. The marker is the week's Sunday, never "today": GitHub
  # ran the 8:32 PM Sunday slot at 3:52 AM Monday on 2026-08-31, and a guard
  # keyed on today's date called that a different week, let it through, and
  # mailed everybody a second digest saying nobody had ridden.
  #
  # The wait is what makes the send punctual. This job holds the runner until
  # 8:30 PM Pacific, so the delivery time depends on a sleep we control rather
  # than on when GitHub feels like starting the job.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          FORCE: ${{ inputs.force }}
          TEST_TO: ${{ inputs.test_to }}
        run: |
          set -uo pipefail
          skip() { echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          go()   { echo "go=true"  >> "$GITHUB_OUTPUT"; exit 0; }

          now() { TZ=America/Los_Angeles date "+$1"; }
          week() {
            local d dw
            d=$(now %F); dw=$(now %w)          # %w: 0 = Sunday
            date -u -d "$d - $dw days" +%F     # back up to this week's Sunday
          }

          echo "Pacific now: $(now '%F %H:%M %a')"

          # A test send goes to one address and never touches the archive, so
          # it is exempt from both questions.
          if [[ "$TEST_TO" != "" ]]; then echo "Test send, always allowed."; go; fi

          if [[ "$FORCE" == "true" ]]; then
            echo "::warning::force was set: sending regardless of the week marker and the clock."
            go
          fi

          wk=$(week)
          if [[ -f "weekly/$wk.html" ]]; then
            echo "::notice::weekly/$wk.html is already in the repo, so the digest for the week ending $wk has been sent. Stopping."
            skip
          fi

          # Sunday only. A run that has slipped past midnight is a run that
          # missed its slot, and a late email is worse than none.
          if [[ "$(now %w)" != "0" ]]; then
            echo "::warning::It is $(now %A) in California, not Sunday, so this run is too late to be the Sunday digest. Nothing sent."
            skip
          fi

          # Wait for 8:30 PM Pacific. This is the actual clock for the send.
          target=$(TZ=America/Los_Angeles date -d "$(now %F) 20:30" +%s)
          left=$(( target - $(date +%s) ))
          if (( left > 19800 )); then
            # More than 5.5 hours early. The job timeout would kill the wait, so
            # let a later cron handle it rather than burning a runner for nothing.
            echo "::warning::$(( left / 3600 )) hours early, which is longer than this job may run. Leaving it to a later attempt."
            skip
          elif (( left > 0 )); then
            echo "Waiting $(( left / 60 )) minutes, until 8:30 PM Pacific."
            sleep "$left"
          elif (( left < -9000 )); then
            # After 11 PM Pacific. Too late to be "Sunday night".
            echo "::warning::It is already $(now %H:%M) in California. Too late for a Sunday night email, so nothing was sent."
            skip
          else
            echo "Past 8:30 PM already, sending now."
          fi

          # Hours may have passed inside that sleep. Ask the marker question
          # again against the LIVE repo: another attempt that was queued behind
          # this one could have sent in the meantime.
          git fetch -q origin main || true
          if git cat-file -e "origin/main:weekly/$wk.html" 2>/dev/null; then
            echo "::notice::The digest for $wk was sent while this run was waiting. Stopping."
            skip
          fi
          go

  digest:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # ref: main, NOT the SHA the schedule pinned. A scheduled run is pinned to
      # whatever main was when GitHub created it, and the guard then sleeps for
      # hours, so by 8:30 PM this checkout can be four hours behind: old code,
      # old standings, and a guaranteed rebase against everything the daily
      # updater pushed in the meantime. On 2026-09-06 that rebase is exactly
      # what killed the send.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Catch up on today's rides first
        # A test send must never touch Strava. The commit step is skipped when
        # test_to is set, so any reads spent here would be thrown away, and the
        # daily budget is shared with 2024michael.
        if: inputs.skip_update != true && inputs.test_to == ''
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: "274192"
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          STRAVA_REFRESH_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          STRAVA_REFRESH_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          STRAVA_REFRESH_MICHAEL: ${{ secrets.STRAVA_REFRESH_MICHAEL }}
          STRAVA_REFRESH_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          STRAVA_REFRESH_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
          STRAVA_REFRESH_OSCAR: ${{ secrets.STRAVA_REFRESH_OSCAR }}
        run: |
          # Sunday rides land after the morning run, and Sunday is when people
          # actually ride. Without this the digest reports a week that ends
          # Saturday. continue-on-error so a rate limit cannot kill the digest.
          python scripts/update.py

      # The email needs pictures of the charts, and email clients do not run
      # JavaScript. Rebuild the season history first so the stills include
      # today's rides, then render and push them BEFORE the send: the email
      # references them by absolute URL, so they have to be live already.
      #
      # continue-on-error throughout. A failed render must never cost the
      # digest; weekly.py simply leaves the images out if the files are absent.
      - name: Refresh the season history
        if: inputs.test_to == ''
        continue-on-error: true
        env:
          CID: "274192"
          CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
          RT_ALI: ${{ secrets.STRAVA_REFRESH_ALI }}
          RT_JAKE: ${{ secrets.STRAVA_REFRESH_JAKE }}
          RT_RANDEE: ${{ secrets.STRAVA_REFRESH_RANDEE }}
          RT_ABE: ${{ secrets.STRAVA_REFRESH_ABE }}
          RT_JOSE: ${{ secrets.STRAVA_REFRESH_JOSE }}
          RT_OSCAR: ${{ secrets.STRAVA_REFRESH_OSCAR }}
        run: python3 scripts/history.py

      - name: Render the race charts
        id: shots
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node scripts/render_race.js race
          ls -la race/*.png

      - name: Publish the charts before the email goes out
        if: inputs.test_to == '' && steps.shots.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"

          # NEVER use --autostash here. update.py has already rewritten
          # data/state.json and data.js in the working tree and they are not
          # part of this commit, so --autostash replays them over whatever the
          # daily updater pushed while this run was asleep. On 2026-09-06 that
          # pop conflicted, git left conflict markers inside data/state.json,
          # the step still exited 0, and weekly.py died on the unparseable
          # JSON. Nobody got an email and nothing said why.
          #
          # So the fresh files are set aside as plain copies, the tree is made
          # clean, only the charts are committed, and the copies go back
          # afterwards. Ours win by construction: update.py ran minutes ago.
          # Nothing is lost if the updater was ahead of us, because state.json
          # carries a per-rider watermark and the next run re-reads from it.
          keep=$(mktemp -d)
          for f in data/state.json data.js data/last_run.json; do
            [ -f "$f" ] && cp "$f" "$keep/$(basename "$f")"
          done
          # One path at a time: git restores nothing at all if any single
          # pathspec in the list is unknown to the index.
          for f in data/state.json data.js data/last_run.json; do
            git checkout -- "$f" 2>/dev/null || true
          done

          git add data/history.js race/green.png race/polka.png
          if git diff --cached --quiet; then
            echo "Charts unchanged."
          else
            git commit -m "Race charts for $(TZ=America/Los_Angeles date +%F)"
            git pull --rebase origin main || { git rebase --abort || true; }
            git push || echo "::warning::Could not push the charts. The email will fall back to text."
            # Pages needs a moment before the email can reference the images.
            sleep 45
          fi

          for f in state.json last_run.json; do
            [ -f "$keep/$f" ] && cp "$keep/$f" "data/$f"
          done
          [ -f "$keep/data.js" ] && cp "$keep/data.js" data.js

      - name: Build the digest
        id: build
        run: |
          # Fail here with a sentence a human can read rather than 30 lines of
          # json.decoder traceback. Everything above this point is
          # continue-on-error, so a broken data file arrives silently.
          for f in data/state.json data/history.js; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty, so the digest cannot be built."; exit 1; }
          done
          if grep -qE '^(<<<<<<<|>>>>>>>) ' data/state.json; then
            echo "::error::data/state.json still has git conflict markers in it. A rebase in an earlier step went wrong; the digest was not built and no email was sent."
            exit 1
          fi
          python -c "import json,sys; json.load(open('data/state.json'))" || {
            echo "::error::data/state.json is not valid JSON, so the digest was not built and no email was sent."; exit 1; }

          python scripts/weekly.py
          # The subject must name the SUNDAY the digest covers, the same day the
          # archive page is named for. Using the runner's UTC date titled every
          # Sunday-night email with Monday's date, because 8:30 PM Pacific is
          # already tomorrow in UTC: the 2026-09-06 digest went out as "week
          # ending Sep 7, 2026" while its own page said Sep 6.
          d=$(TZ=America/Los_Angeles date +%F)
          dw=$(TZ=America/Los_Angeles date +%w)          # %w: 0 = Sunday
          sun=$(date -u -d "$d - $dw days" +'%b %d, %Y' | sed 's/ 0/ /')
          echo "week=$sun" >> "$GITHUB_OUTPUT"

      - name: Check mail credentials
        id: mail
        env:
          U: ${{ secrets.MAIL_USERNAME }}
          P: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [[ -n "$U" && -n "$P" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAIL_USERNAME or MAIL_PASSWORD is not set, so no email was sent. The digest was still built and committed."
          fi

      - name: Email the digest
        if: steps.mail.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Tour de SoCal
          # MAIL_TO is optional. With it unset the digest goes to the sender only,
          # so adding riders later is one secret and no code change.
          # A manual run can override the recipient list, so the formatting can
          # be checked without mailing everybody.
          to: ${{ inputs.test_to != '' && inputs.test_to || (secrets.MAIL_TO || secrets.MAIL_USERNAME) }}
          subject: "${{ inputs.test_to != '' && '[TEST] ' || '' }}Tour de SoCal, week ending ${{ steps.build.outputs.week }}"
          html_body: file:///tmp/weekly_email.html
          convert_markdown: false

      - name: Commit the digest and next week's snapshot
        if: inputs.test_to == ''
        run: |
          git config user.name "tourdesocal-bot"
          git config user.email "actions@users.noreply.github.com"
          # weekly/ holds one page per email actually sent, plus its index.
          # This step only runs when test_to is empty, so a test send never
          # lands in the archive.
          git add weekly.html weekly/ data/weekly_snapshot.json data/weekly_latest.json \
                  data/state.json data.js data/last_run.json data/honours.json \
                  data/history.js race/green.png race/polka.png
          if git diff --cached --quiet; then
            echo "No digest changes."
          else
            git commit -m "Weekly digest $(TZ=America/Los_Angeles date +%F)"
            # This commit is the ONLY proof the email went out: the later crons
            # look for weekly/<sunday>.html and stop when they find it. If this
            # push fails, everybody gets a second digest an hour later. So it
            # rebases with -X theirs, which during a rebase means "keep the
            # commit being replayed", i.e. ours, and it retries.
            #
            # Our copies are the newer ones by construction: update.py and
            # weekly.py both ran within the last few minutes.
            pushed=false
            for attempt in 1 2 3; do
              git fetch -q origin main || true
              if git rebase -X theirs origin/main; then
                if git push; then pushed=true; break; fi
              else
                git rebase --abort || true
              fi
              echo "Push attempt $attempt lost a race. Retrying."
              sleep 15
            done
            if [ "$pushed" != true ]; then
              echo "::error::The digest email was SENT but weekly/ could not be updated. The week marker is missing, so a later scheduled run may send a second copy. Push the archive by hand before 11 PM Pacific."
              exit 1
            fi
          fi
